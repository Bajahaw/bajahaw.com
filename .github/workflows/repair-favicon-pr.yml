name: Repair favicon PR

on:
  push:
    branches:
      - fix/favicon-local

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/favicon-local
          fetch-depth: 0
      - name: Apply favicon fix
        shell: bash
        run: |
          git fetch origin main
          git restore --source=origin/main -- index.html
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text()
          text = text.replace('https://backend.bajahaw.com/favicon.png', '/favicon.svg')
          p.write_text(text)
          PY
          cat > favicon.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
            <rect width="64" height="64" rx="14" fill="#050511"/>
            <circle cx="32" cy="32" r="20" fill="none" stroke="#8b5cf6" stroke-width="3"/>
            <circle cx="25" cy="25" r="4" fill="#fff"/>
            <circle cx="42" cy="39" r="3" fill="#38bdf8"/>
            <path d="M18 43c8-9 20-11 29-5" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="3"/>
          </svg>
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html favicon.svg
          git diff --cached --quiet && exit 0
          git commit -m 'Fix favicon hotlinking'
          git push origin HEAD:fix/favicon-local
